services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-finops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-finops_dev_password}@postgres:5432/${POSTGRES_DB:-finops}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_to_a_random_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:80"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:-finops_dev_password}@postgres:5432/${POSTGRES_DB:-finops}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_to_a_random_secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    entrypoint: []
    command: >
      sh -c "alembic upgrade head &&
             cd /app/data_generator && python run.py &&
             cd /app/backend && python scripts/seed.py &&
             python scripts/process_batches.py"

volumes:
  postgres_data:
